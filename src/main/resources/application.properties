spring.application.name=agrosentinel
spring.config.import=optional:file:.env[.properties]

# Credenciales de base de datos configuradas por entorno
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:2}
spring.datasource.hikari.minimum-idle=0

# Retry database connection during startup to tolerate transient provider pool saturation.
spring.flyway.connect-retries=${DB_CONNECT_RETRIES:10}
spring.flyway.connect-retries-interval=${DB_CONNECT_RETRY_INTERVAL:5}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Reemplazar JWT_SECRET con un secreto aleatorio de al menos 32 bytes fuera de desarrollo local.
agrosentinel.security.jwt-secret=${JWT_SECRET:AgroSentinelDevJwtSecretChangeThisBeforeProduction2026}
agrosentinel.security.jwt-lifetime-seconds=${JWT_LIFETIME_SECONDS:3600}
agrosentinel.predictive.api-token=${PREDICTIVE_API_TOKEN:AgroSentinelPredictiveDevToken2026}
agrosentinel.predictive.api-url=${PREDICTIVE_API_URL:http://localhost:8000}
agrosentinel.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://agrosentinel-frontend.onrender.com}
agrosentinel.failure-evidence.location=${FAILURE_EVIDENCE_LOCATION:uploads/failure-evidence}
agrosentinel.maintenance-evidence.location=${MAINTENANCE_EVIDENCE_LOCATION:uploads/maintenance-evidence}

# Puerto
server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
