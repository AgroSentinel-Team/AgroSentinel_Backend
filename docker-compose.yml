services:
  backend:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - failure_evidence:/app/uploads/failure-evidence
      - maintenance_evidence:/app/uploads/maintenance-evidence
      - asset_images:/app/uploads/asset-images

volumes:
  failure_evidence:
  maintenance_evidence:
  asset_images: